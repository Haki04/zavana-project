<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="../src/style.css" />
  </head>
  <body>
    <div
      class="w-full h-screen flex justify-center items-center bg-gray-200/70"
    >
      <div class="w-[350px] p-2 bg-gray-100/50 shadow-lg rounded-2xl">
        <h1 class="font-bold text-4xl mb-2 w-full text-center">LOGIN</h1>
        <div class="flex flex-col justify-around items-center gap-2 mt-5">
          <input
            id="user-name"
            class="w-[80%] bg-white rounded p-2"
            placeholder="Username"
            oninput="cekUser(this.value)"
            autocomplete="off"
          />
          <input
            id="user-password"
            class="w-[80%] bg-white rounded p-2"
            placeholder="Password"
          />
          <span class="w-[80%] bg-white rounded p-2" id="sebagai"
            >Sebagai :</span
          >
          <button
            class="w-[50%] bg-white mt-10 rounded p-2 cursor-pointer font-bold hover:bg-green-100 hover:shadow-sm relative"
            id="btn-login"
            onclick="login()"
          >
            Login
          </button>
        </div>
      </div>
    </div>
    <script>
      window.onload = () => {
        if (getCookie()) {
          if (getCookie().level == 1)
            return (window.location.href = "/pages/admin/");
        }
        // return (window.location.href = "/pages/users/profile");
      };
    </script>
    <script type="module" src="/src/view/login.js"></script>
  </body>
</html>
