<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snacks Room</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="w-full h-screen bg-amber-100 flex flex-col items-center p-2">
      <div
        class="w-full h-full bg-white/40 fixed z-10 flex justify-center items-center hidden"
        id="pop-up"
      >
        <div
          class="w-[200px] bg-gray-400 [&>*:not(span)]:w-full [&>*:not(span)]:bg-white p-2 [&>*]:mb-2 [&>*]:py-2 [&>*]:text-center rounded relative"
        >
          <span
            class="absolute -top-5 -right-5 text-amber-600 cursor-pointer w-[10px]"
            onclick="togglePopUp()"
            >X</span
          >
          <input type="text" value="" id="room" disabled />
          <select name="" value="" id="snack-eat">
            <option value="" disabled selected>Select item</option>
            <option value="happitos">H</option>
            <option value="citato">C</option>
            <option value="happytos | citato">H | C</option>
          </select>
          <button
            class="cursor-pointer"
            onclick="
              sendSnackEat(
                document.getElementById('snack-eat'),
                document.getElementById('room'),
              )
            "
          >
            Send
          </button>
        </div>
      </div>
      <div
        class="w-[80%] max-w-[1200px] h-full bg-white/40 flex flex-row flex-wrap justify-center content-start gap-1 overflow-auto"
        id="snacks"
      ></div>
      <script type="module" src="/src/view/snacks.js"></script>
    </div>
  </body>
</html>
