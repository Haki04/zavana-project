<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stoks</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <input class="hidden" type="checkbox" name="" id="toggle" />

    <div
      class="relative w-full h-screen bg-white overflow-hidden flex justify-center items-center"
    >
      <div
        class="absolute md:fixed md:w-[20%] w-[70%] top-1 md:left-2 rounded z-10 bg-red-100/70 p-2 flex justify-between"
      >
        <h1 class="text-[14px] font-bold" id="greating-user"></h1>
        <div class="w-fit">
          <span
            class="cursor-pointer select-none"
            onclick="window.location.href = '/pages/users/'"
            ><img class="w-[20px]" src="/icon/home.png"
          /></span>
        </div>
      </div>
      <div
        class="w-[95%] lg:w-[80%] lg:border h-[95%] p-2 rounded flex-wrap flex md:grid grid-cols-5 relative justify-items-center justify-center content-start gap-1 pt-13 md:pt-10"
        id="content"
      ></div>
    </div>
    <script>
      window.onload = () => {
        if (!getCookie()) {
          return (window.location.href = "/pages/login.html");
        }
        if (getCookie().level == 1) {
          return (window.location.href = "/pages/admin/");
        }
        showBoxStocks(getCookie().position);
        greatingUser();
      };
    </script>
    <script type="module" src="/src/view/stocks.js"></script>
  </body>
</html>
