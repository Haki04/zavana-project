<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>Kerusakan</title>
  </head>
  <body>
    <div class="w-full h-screen bg-white flex justify-center items-center">
      <div
        class="bg-gray-200/50 shadow h-[90%] w-full lg:w-[80%] rounded p-2 overflow-hidden flex flex-col justify-start relative"
        id="content"
      >
        <div class="w-full h-fit">
          <div class="w-full flex justify-between bg-white">
            <h1 class="text-2xl pl-2 flex-1">Kerusakan</h1>
            <div
              class="flex-1 md:w-[200px] md:flex-none bg-amber-100 flex items-center"
            >
              <select
                name=""
                id="select-dashboard-kerusakan"
                class="flex-2 pl-1 outline-0"
                onchange="filterKerusakan(this.value)"
              ></select>
            </div>
          </div>
          <div class="w-full bg-white max-[450px]:hidden" id="top-bar-ul">
            <ul class="flex flex-row justify-around items-center">
              <li>posisi</li>
              <li>repoter</li>
              <li>status</li>
              <li>date</li>
              <li>action</li>
            </ul>
          </div>
        </div>
        <div
          class="w-full bg-slate-100 h-full p-1 overflow-y-scroll"
          id="kerusakan"
        ></div>
      </div>
    </div>
    <script>
      window.onload = () => {
        if (!getCookie()) {
          return (window.location.href = "/pages/login.html");
        }
        if (getCookie().level == 1) {
          return (window.location.href = "/pages/admin/");
        }
        getDataBrokeness("kerusakan", "kerusakan");
      };
    </script>
    <script type="module" src="/src/view/kerusakan.js"></script>
  </body>
</html>
