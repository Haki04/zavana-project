<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Information</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="w-full h-screen bg-gray-50 flex justify-center items-center">
      <div
        class="w-[80%] h-[80%] max-w-[1000px] bg-white rounded overflow-hidden shadow-sm"
        id="content"
      >
        <!-- atas -->
        <div class="w-full bg-white p-2 h-[10%] border-b-2 border-gray-100">
          <ul
            class="w-full h-full flex justify-around items-center [&>*]:p-2 [&>*]:flex-1 gap-2 [&>*]:rounded [&>*]:text-center [&>*]:cursor-pointer [&>*]:shadow"
            id="ul-information"
          >
            <li onclick="filterInformation(this, 'all')" class="bg-green-200">
              All
            </li>
            <li onclick="filterInformation(this, 'hk')">HK</li>
            <li onclick="filterInformation(this, 'fo')">FO</li>
            <li onclick="filterInformation(this, 'ktn')">KTN</li>
            <li onclick="filterInformation(this, 'eng')">ENG</li>
          </ul>
        </div>
        <!-- bawah -->
        <div
          class="w-full h-[90%] bg-white/50 p-2 flex flex-wrap gap-2 justify-center overflow-y-scroll"
          id="content-information"
        ></div>
      </div>
    </div>
    <script>
      window.onload = async () => {
        if (!getCookie()) {
          return (window.location.href = "/pages/login.html");
        }
        if (getCookie().level == 1) {
          return (window.location.href = "/pages/admin/");
        }
        showInformation("content-information");
      };
    </script>
    <script type="module" src="/src/view/information.js"></script>
  </body>
</html>
