<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rooms</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="w-full h-screen flex justify-center items-center bg-gray-100">
      <div
        class="w-[80%] h-[90%] max-[600px]:w-full max-[600px]:h-full pt-4 max-[600px]:pt-10 bg-white rounded p-2 relative flex justify-center flex-wrap gap-2 overflow-y-scroll content-start"
        id="content-rooms"
      ></div>
    </div>
    <script>
      window.onload = () => {
        if (!getCookie()) {
          return (window.location.href = "/pages/login.html");
        }
        if (getCookie().level == 1) {
          return (window.location.href = "/pages/admin/");
        }
        showItemRooms();
        backPages();
      };
    </script>
    <script type="module" src="/src/view/rooms.js"></script>
  </body>
</html>
