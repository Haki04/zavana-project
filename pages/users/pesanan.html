<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pesanan</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="w-full h-screen bg-white flex flex-col items-center p-2">
      <div
        class="w-full md:w-[80%] max-w-[1200px] h-full bg-gray-100/40 grid grid-cols-1 md:grid-cols-4 lg:grid-cols-5 justify-items-center gap-5 md:gap-2 overflow-y-scroll"
        id="pesanan"
      ></div>
    </div>
    <script>
      window.onload = () => {
        if (!getCookie()) {
          return (window.location.href = "/pages/login.html");
        }
        if (getCookie().level == 1) {
          return (window.location.href = "/pages/admin/");
        }
        showOrdersItem(document.getElementById("pesanan"));
      };
    </script>
    <script type="module" src="/src/view/pesanan.js"></script>
  </body>
</html>
