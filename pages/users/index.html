<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Users</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div
      class="w-full h-screen bg-gray-100 flex justify-center items-center overflow-hidden"
    >
      <div
        class="relative w-full md:w-[90%] md:rounded min-h-0 h-full md:h-[90%] bg-white shadow flex flex-col md:grid grid-cols-3 justify-items-center place-content-start items-center justify-start p-1 gap-1 overflow-y-scroll pt-15 md:pt-5"
        id="content-user"
      >
        <div
          class="fixed md:absolute left-3 top-3 bp-1 bg-white/80 md:bg-gray-200/50 p-1 w-fit"
          id="greating"
        ></div>
      </div>
    </div>
    <script>
      window.onload = () => {
        if (!getCookie()) {
          return (window.location.href = "/pages/login.html");
        }
        if (getCookie().level == 1) {
          return (window.location.href = "/pages/admin/");
        }
        greating(getCookie().name);
        showUserSection(document.getElementById("content-user"));
      };
    </script>
    <script type="module" src="/src/view/section.js"></script>
  </body>
</html>
