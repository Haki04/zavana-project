<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barang</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="w-full h-screen flex justify-center items-center">
      <div
        class="w-[90%] h-[90%] max-w-[1000px] bg-gray-200/75 rounded-2xl flex overflow-hidden p-2"
      >
        <!-- kiri -->
        <div
          class="w-[20%] h-full flex flex-col justify-start items-center bg-white"
        >
          <div class="h-[20%] bg-red-200 w-full">
            <img src="" class="w-[80%] border-4 h-[80%]" alt="" />
          </div>
          <div class="h-[60%] bg-blue-200 w-full p-1">
            <ul
              class="w-full h-full flex flex-col justify-center gap-7 [&>*]:p-1 [&>*]:border [&>*]:border-transparent [&>*]:hover:border-black [&>*]:hover:bg-yellow-100 [&>*]:rounded [&>*]:text-left [&>*]:cursor-pointer transition"
            >
              <li onclick="section('dashboard')">Dashboard</li>
              <li onclick="section('inventory')">Inventory</li>
              <li onclick="section('staff')">Staff</li>
              <li onclick="section('pesanan')">Pesanan</li>
              <li onclick="section('kerusakan')">Kerusakan</li>
            </ul>
          </div>
          <div
            class="h-[20%] bg-green-200 w-full flex justify-center flex-col items-center"
          >
            <img src="" alt="" class="w-[50px] border-4 h-[50px]" />
            <span class="font-bold text-[10px]">KIKI</span>
            <span class="font-bold text-[14px] p-1 bg-gray-50 rounded"
              >Log Out</span
            >
          </div>
        </div>

        <!-- kanan -->
        <div
          class="w-[80%] h-full bg-gray-200 rounded-r-[10px] flex flex-wrap gap-1 content-start p-1 overflow-y-scroll relative"
          id="content-right"
        ></div>
      </div>
    </div>
    <script type="module" src="/src/view/dashboard.js"></script>
  </body>
</html>
