  <body>
    <input type="checkbox" name="" id="toggle" class="hidden" />
    <div
      id="container"
      class="w-full min-w-[300px] bg-amber-50 h-screen overflow-hidden"
    >
      <div
        id="my-choose"
        class="absolute z-10 w-full h-screen flex justify-center items-center hidden bg-white/50"
      >
        <div
          class="w-[50%] max-w-[300px] h-[50%] min-h-[400px] bg-white/95 rounded p-1 flex flex-col items-center justify-center gap-3 relative shadow-sm border-2 border-gray-400/50"
        >
          <span
            class="absolute -top-4 -right-4 cursor-pointer font-bold text-red-400"
            onclick="toggleShow()"
            >X</span
          >
          <h1 class="font-bold">My Breakfast</h1>
          <input
            type="text"
            placeholder="Name"
            class="w-[80%] bg-amber-200 p-1 md:p-2 rounded text-sm outline-none"
            id="input-name"
          />
          <select
            name=""
            class="w-[80%] bg-amber-200 p-1 md:p-2 rounded text-sm"
            id="room-number"
          >
            <option value="" disabled selected>Room number</option>
          </select>

          <ul
            class="w-[80%] h-[40%] overflow-scroll no-scrollbar"
            id="list-breakfast"
          ></ul>
          <button
            id="send-button"
            class="bg-green-500 w-[60%] rounded p-1 cursor-pointer text-[10px] md:text-sm"
            onclick="sendWhatsApp()"
          >
            kirim to WhatsApp
          </button>
        </div>
      </div>
      <div id="nav" class="w-full flex justify-center absolute bg-white">
        <ul
          class="flex flex-row bg-transparent w-full justify-center items-center lg:gap-4 gap-1 md:justify-around lg:justify-center p-1"
        >
          <li class="li-list" onclick="menuFilter(this)" data-filter="all">
            All
          </li>
          <li
            class="li-list"
            onclick="menuFilter(this)"
            data-filter="indonesian"
          >
            Indonesian
          </li>
          <li class="li-list" onclick="menuFilter(this)" data-filter="zavana">
            Zavana
          </li>
          <li
            class="li-list"
            onclick="menuFilter(this)"
            data-filter="vegetarian"
          >
            Vegetarian
          </li>
          <li class="li-list" onclick="menuFilter(this)" data-filter="drink">
            Drink
          </li>
          <li
            class="li-list md:w-[20px] md:h-[20px] w-[15px] h-[15px] absolute right-[5%] md:relative lg:absolute last:!border-b-transparent"
            id="my-choose"
          >
            <span id="count-list" class="absolute -top-2 -right-2 text-[10px]"
              >0</span
            >
            <img
              src="./assets/img/pencil.png"
              alt=""
              class="md:w-[20px] w-[15px]"
              onclick="toggleShow()"
            />
          </li>
        </ul>
      </div>
